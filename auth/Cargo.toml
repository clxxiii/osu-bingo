[package]
name = "bingo-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
bingolib = { path = "../bingolib" }
chrono = { version = "0.4.41", features = ["serde"] }
colog = "1.3.0"
log = "0.4.27"
serde = "1.0.219"
serde_json = "1.0.142"
sqlx = { version = "0.8.6", default-features = false, features = [
    "chrono",
    "runtime-tokio",
    "migrate",
    "macros",
    "postgres",
] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
