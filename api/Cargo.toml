[package]
name = "bingo-api"
version.workspace = true
edition = "2024"

[dependencies]
axum = "0.8.4"
bingolib = { path = "../bingolib" }
chrono = { version = "0.4.41", features = ["serde"] }
colog = "1.3.0"
dotenv = "0.15.0"
juniper = { version = "0.16.2", features = [
    "chrono",
    "chrono-tz",
    "schema-language",
] }
juniper_axum = "0.2.0"
log = "0.4.27"
serde = "1.0.219"
serde_json = "1.0.142"
sqlx = { version = "0.8.6", default-features = false, features = [
    "chrono",
    "runtime-tokio",
    "migrate",
    "macros",
    "postgres",
] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
